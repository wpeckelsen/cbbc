version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: cbbc_db
      POSTGRES_USER: cbbc_user
      POSTGRES_PASSWORD: cbbc_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  worker:
    build: .
    env_file:
      - .env
    depends_on:
      - postgres
    # Override DATABASE_URL for local dev
    environment:
      DATABASE_URL: postgresql://cbbc_user:cbbc_pass@postgres:5432/cbbc_db
    # Run cron directly on startup
    command: ["node", "dist/worker.js"]

volumes:
  postgres_data: